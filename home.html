<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Tech Solutions | Kenya's Premier IT Partner</title>
  <link rel="icon" href="Logo1.jpg" type="image/jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    :root {
      --berkeley-blue: #003262;
      --berkeley-gold: #FDB515;
      --silver-bg: #e5e7e9; 
      --white: #ffffff;
      --success-green: #27ae60;
    }

    body { font-family: 'Open Sans', Arial, sans-serif; margin: 0; background-color: var(--silver-bg); overflow-x: hidden; }

    /* --- PAYMENT MODAL & SUCCESS STYLES --- */
    .payment-container {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .mpesa-logo { width: 150px; margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .pay-now-btn {
      background: #49c561;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }

    /* Success Overlay */
    #success-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .checkmark-circle {
      width: 100px;
      height: 100px;
      background: var(--success-green);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      animation: scaleIn 0.5s ease;
    }

    .checkmark-circle i { color: white; font-size: 50px; }

    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* --- EXISTING SHOP STYLES --- */
    .utility-nav { background: var(--berkeley-blue); padding: 10px 10%; display: flex; justify-content: flex-end; gap: 20px; font-size: 12px; }
    .utility-nav a { color: #fff; text-decoration: none; font-weight: bold; }
    header { background: var(--white); text-align: center; padding-top: 27px; border-bottom: 4px solid var(--berkeley-gold); }
    .main-nav { display: flex; justify-content: center; gap: 40px; list-style: none; padding: 15px 0; margin: 0; }
    .main-nav a { color: var(--berkeley-blue); text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    .hero { background: linear-gradient(rgba(0,50,98,0.6), rgba(0,50,98,0.6)), url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=80&w=1470'); height: 300px; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
  </style>
</head>
<body>

  <div id="success-overlay">
    <div class="checkmark-circle">
      <i class="fas fa-check"></i>
    </div>
    <h1 style="color: var(--berkeley-blue);">Payment Successful!</h1>
    <p>Your transaction has been processed. A receipt has been sent to your phone.</p>
    <button onclick="closeSuccess()" style="margin-top:20px; padding: 10px 30px; cursor:pointer;">Back to Shop</button>
  </div>

  <div class="utility-nav">
    <a href="#">Technical Support</a>
    <a href="https://wa.me/254708902232" style="color: var(--berkeley-gold)">Get a Quote</a>
  </div>

  <header>
    <a href="index.html" style="font-size: 32px; font-weight: 800; text-decoration: none; color: var(--berkeley-blue);">PRIME TECH <span style="color: var(--berkeley-gold);">SOLUTIONS</span></a>
    <ul class="main-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="Invoice.html">Invoice</a></li>
    </ul>
  </header>

  <section class="hero">
    <h1>Secure M-Pesa Checkout</h1>
  </section>

  <div class="payment-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" class="mpesa-logo" alt="M-Pesa">
    <h3>Enter Details to Pay</h3>
    <form id="mpesaForm">
      <input type="text" id="phone" placeholder="Phone (e.g., 254708902232)" required>
      <input type="number" id="amount" placeholder="Amount (KSh)" required>
      <button type="submit" class="pay-now-btn" id="payBtn">Initiate STK Push</button>
    </form>
    <div id="status-msg" style="margin-top: 15px; font-size: 13px; color: #666;"></div>
  </div>

  <script>
    const mpesaForm = document.getElementById('mpesaForm');
    const payBtn = document.getElementById('payBtn');
    const statusMsg = document.getElementById('status-msg');
    const successOverlay = document.getElementById('success-overlay');

    mpesaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phone = document.getElementById('phone').value;
      const amount = document.getElementById('amount').value;

      // 1. UI Loading State
      payBtn.disabled = true;
      payBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending Request...';
      statusMsg.innerText = "Check your phone for the M-Pesa PIN prompt.";

      /* NOTE: In a real environment, you call your backend (Node.js/Python/PHP) 
         which holds your Safaricom Consumer Keys.
      */
      
      // Simulate API Call Delay
      setTimeout(() => {
        // Mocking a successful STK Push trigger
        statusMsg.style.color = "green";
        statusMsg.innerText = "Request Sent! Please enter PIN on your phone.";

        // Simulate waiting for Safaricom Callback (usually takes 5-10 seconds)
        setTimeout(() => {
          showSuccess();
        }, 5000);

      }, 2000);
    });

    function showSuccess() {
      successOverlay.style.display = 'flex';
      // Optional: Play a success sound
    }

    function closeSuccess() {
      successOverlay.style.display = 'none';
      window.location.reload();
    }
  </script>

</body>
</html>
