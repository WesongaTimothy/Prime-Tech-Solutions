<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Portal | Prime Tech Solutions</title>
    <meta name="description" content="Pay your Prime Tech Solutions invoice securely via M-Pesa.">
    
    <link rel="icon" href="Logo1.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="Logo1.jpg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --berkeley-blue: #003262;
            --berkeley-gold: #FDB515;
            --silver-bg: #e5e7e9; 
            --white: #ffffff;
            --mpesa-green: #10b981;
        }

        body { 
            font-family: 'Open Sans', sans-serif; 
            margin: 0; 
            background-color: var(--silver-bg); 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header { background: var(--white); text-align: center; padding: 20px 0 0; }
        .logo-container img { height: 70px; width: auto; }
        .nav-container { border-bottom: 4px solid var(--berkeley-gold); padding-bottom: 15px; }
        .main-nav { display: flex; justify-content: center; gap: 25px; list-style: none; padding: 0; }
        .main-nav a { color: var(--berkeley-blue); text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; }

        /* --- PAYMENT AREA --- */
        .payment-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 10%;
            background: linear-gradient(rgba(0,50,98,0.8), rgba(0,50,98,0.8)), url('https://images.pexels.com/photos/3183150/pexels-photo-3183150.jpeg?auto=compress&cs=tinysrgb&w=1260');
            background-size: cover;
        }

        .payment-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .payment-card-header {
            background: var(--berkeley-blue);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--berkeley-gold);
        }

        .payment-body { padding: 30px; }

        /* --- FORM STYLING --- */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #payBtn {
            width: 100%;
            background: var(--mpesa-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        #payBtn:disabled { background: #ccc; cursor: not-allowed; }

        #msg { text-align: center; font-size: 13px; margin-top: 15px; font-weight: 600; }

        /* --- SUCCESS OVERLAY --- */
        #successOverlay {
            display: none; /* Controlled by app.js */
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .success-icon { color: var(--mpesa-green); font-size: 60px; margin-bottom: 20px; }

        footer { background: #111; color: #777; padding: 40px 10%; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Logo1.jpg" alt="Prime Tech Solutions Logo">
        </div>
        <nav class="nav-container">
            <ul class="main-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="Invoice.html" style="color: var(--berkeley-gold)">Invoice</a></li>
            </ul>
        </nav>
    </header>

    <main class="payment-container">
        <div class="payment-card">
            <div id="successOverlay">
                <i class="fas fa-check-circle success-icon"></i>
                <h2 style="color: var(--berkeley-blue);">Payment Successful!</h2>
                <p>Thank you for choosing Prime Tech Solutions.</p>
                <button onclick="window.location.reload()" style="background: var(--berkeley-blue); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Done</button>
            </div>

            <div class="payment-card-header">
                <h2>M-Pesa STK Push</h2>
            </div>
            
            <div class="payment-body">
                <form id="stkForm">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" placeholder="0712345678" required>
                    </div>
                    <div class="form-group">
                        <label>Amount (KES)</label>
                        <input type="number" id="amount" placeholder="1.00" required>
                    </div>
                    <button type="submit" id="payBtn">Pay with M-Pesa</button>
                    <div id="msg"></div>
                </form>

                <p style="text-align: center; font-size: 10px; color: #999; margin-top: 20px;">
                    <i class="fas fa-lock"></i> SECURE PAYMENT GATEWAY
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Prime Tech Solutions. Nairobi, Kenya.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
